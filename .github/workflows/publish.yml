# Publish the n8n community node to npm with provenance.
#
# n8n Creator Portal verification requires packages to be published from
# GitHub Actions with npm provenance. After npm publish succeeds, submit the
# npm package in the n8n Creator Portal for verification.
#
# One-time npm setup, recommended:
#   Package settings -> Publish access -> Trusted Publishers -> Add publisher
#   Repository owner: NexvioAI
#   Repository name: n8n-nodes-nexvio
#   Workflow filename: publish.yml
#
# Token fallback:
#   Add an npm automation/granular publish token as the NPM_TOKEN repository secret.

name: Publish

on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          NPM_CONFIG_ACCESS: public
